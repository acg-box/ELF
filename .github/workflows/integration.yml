name: Integration Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "docs/**"
  merge_group:
  workflow_dispatch:
  schedule:
    # Daily at 00:00 UTC. Manual runs use workflow_dispatch.
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  integration:
    name: Run integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELF_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres
      ELF_QDRANT_HTTP_URL: http://127.0.0.1:6333
      ELF_QDRANT_GRPC_URL: http://127.0.0.1:6334
      ELF_QDRANT_URL: http://127.0.0.1:6334
      RUST_BACKTRACE: full
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.16.3
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - name: Fetch latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust CI tools
        uses: ./.github/actions/setup-rust
        with:
          integration: 'true'

      - name: Wait for Qdrant
        run: |
          for _attempt in {1..30}; do
            curl -sSf http://127.0.0.1:6333/collections >/dev/null && exit 0
            sleep 1
          done
          echo "Qdrant did not become ready in time."
          exit 1

      - name: Run integration tests
        run: cargo make ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'test-rust-all' || 'test-rust-integration' }}
