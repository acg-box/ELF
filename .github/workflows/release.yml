name: Release

permissions:
  contents: read

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target.name }} package
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: aarch64-apple-darwin
            os: macos-latest
            archive: elf-aarch64-apple-darwin.zip
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: elf-x86_64-unknown-linux-gnu.tar.gz
          - name: x86_64-pc-windows-msvc
            os: windows-latest
            archive: elf-x86_64-pc-windows-msvc.zip
    steps:
      - name: Fetch exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust CI tools
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target.name }}

      - name: Remove cached package outputs with embedded Git identity
        run: cargo make clean-release --target ${{ matrix.target.name }}

      - name: Build shipped binaries in one Cargo graph
        run: cargo make build-release --target ${{ matrix.target.name }}

      - name: Verify binary identity and pack (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target.name }}
          RELEASE_ARCHIVE: ${{ matrix.target.archive }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for bin in elf-api elf-worker elf-mcp elf-eval; do
            binary="target/${RELEASE_TARGET}/release/${bin}"
            version="$("${binary}" --version)"
            case "${version}" in
              *"-${GITHUB_SHA}-${RELEASE_TARGET}") ;;
              *) echo "Unexpected binary identity: ${version}" >&2; exit 1 ;;
            esac
            cp "${binary}" dist/
          done
          if [[ "${RUNNER_OS}" == macOS ]]; then
            (cd dist && zip "../${RELEASE_ARCHIVE}" ./*)
          else
            tar -czf "${RELEASE_ARCHIVE}" -C dist .
          fi

      - name: Verify binary identity and pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target.name }}
          RELEASE_ARCHIVE: ${{ matrix.target.archive }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($binaryName in @('elf-api', 'elf-worker', 'elf-mcp', 'elf-eval')) {
            $binary = "target/$env:RELEASE_TARGET/release/$binaryName.exe"
            $version = & $binary --version
            if ($LASTEXITCODE -ne 0 -or -not $version.EndsWith("-$env:GITHUB_SHA-$env:RELEASE_TARGET")) {
              throw "Unexpected binary identity: $version"
            }
            Copy-Item $binary dist/
          }
          Compress-Archive -Path dist/* -DestinationPath $env:RELEASE_ARCHIVE

      - name: Upload exact archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          if-no-files-found: error
          path: ${{ matrix.target.archive }}
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Download verified archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          merge-multiple: true
          path: artifacts
          pattern: elf-*
          skip-decompress: true

      - name: Verify complete archive set and executable membership
        shell: bash
        run: |
          set -euo pipefail
          test "$(find artifacts -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 3
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            if [[ "${target}" == x86_64-unknown-linux-gnu ]]; then
              archive="artifacts/elf-${target}.tar.gz"
              tar -tzf "${archive}" | sed 's|^./||' | sed '/^$/d' | sort > actual-members
            else
              archive="artifacts/elf-${target}.zip"
              unzip -t "${archive}"
              unzip -Z1 "${archive}" | sort > actual-members
            fi
            suffix=''
            if [[ "${target}" == x86_64-pc-windows-msvc ]]; then suffix='.exe'; fi
            printf '%s\n' "elf-api${suffix}" "elf-eval${suffix}" "elf-mcp${suffix}" "elf-worker${suffix}" > expected-members
            diff -u expected-members actual-members
          done

      - name: Hash release archives
        working-directory: artifacts
        run: |
          sha256sum -- elf-* | tee SHA256
          md5sum -- elf-* | tee MD5

      - name: Publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          discussion_category_name: Announcements
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
