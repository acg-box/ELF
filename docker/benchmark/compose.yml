x-unit: &unit
  image: ${BENCHMARK_IMAGE}
  init: true
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &unit-environment
    CHAT_API_BASE: ${BENCHMARK_CHAT_API_BASE}
    CHAT_API_KEY: ${BENCHMARK_CHAT_API_KEY}
    CHAT_MODEL: ${BENCHMARK_CHAT_MODEL}
    CHAT_REASONING_EFFORT: ${BENCHMARK_CHAT_REASONING_EFFORT}
    EMBEDDING_API_BASE: ${BENCHMARK_EMBEDDING_API_BASE}
    EMBEDDING_API_KEY: ${BENCHMARK_EMBEDDING_API_KEY}
    EMBEDDING_MODEL: ${BENCHMARK_EMBEDDING_MODEL}
    EMBEDDING_DIMENSIONS: ${BENCHMARK_EMBEDDING_DIMENSIONS}
  volumes: &unit-volumes
    - type: bind
      source: ${BENCHMARK_INPUT_HOST}
      target: /benchmark/input
      read_only: true
    - type: bind
      source: ${BENCHMARK_ARTIFACT_HOST}
      target: /benchmark/artifacts

x-honcho-environment: &honcho-environment
  DB_CONNECTION_URI: postgresql+psycopg://postgres:${BENCHMARK_POSTGRES_PASSWORD}@honcho-database:5432/postgres
  CACHE_URL: redis://honcho-redis:6379/0?suppress=true
  CACHE_ENABLED: "true"
  AUTH_USE_AUTH: "false"
  EMBED_MESSAGES: "true"
  EMBEDDING_VECTOR_DIMENSIONS: ${BENCHMARK_EMBEDDING_DIMENSIONS}
  EMBEDDING_MODEL_CONFIG__TRANSPORT: openai
  EMBEDDING_MODEL_CONFIG__MODEL: ${BENCHMARK_EMBEDDING_MODEL}
  EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: ${BENCHMARK_EMBEDDING_API_BASE}
  EMBEDDING_MODEL_CONFIG__OVERRIDES__API_KEY_ENV: EMBEDDING_API_KEY
  EMBEDDING_API_KEY: ${BENCHMARK_EMBEDDING_API_KEY}
  LLM_OPENAI_API_KEY: ${BENCHMARK_CHAT_API_KEY}
  DERIVER_MODEL_CONFIG__TRANSPORT: openai
  DERIVER_MODEL_CONFIG__MODEL: ${BENCHMARK_CHAT_MODEL}
  DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: ${BENCHMARK_CHAT_API_BASE}
  DERIVER_MODEL_CONFIG__THINKING_EFFORT: ${BENCHMARK_CHAT_REASONING_EFFORT}

services:
  memos-neo4j:
    image: neo4j:5.26.6-community
    environment:
      NEO4J_AUTH: neo4j/${BENCHMARK_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1'"]
      interval: 3s
      timeout: 10s
      retries: 40

  memos:
    image: ${BENCHMARK_MEMOS_SERVER_IMAGE:-elf-benchmark-memos:v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      memos-neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      OPENAI_API_KEY: ${BENCHMARK_CHAT_API_KEY}
      OPENAI_API_BASE: ${BENCHMARK_CHAT_API_BASE}
      MOS_CHAT_MODEL: ${BENCHMARK_CHAT_MODEL}
      MEMRADER_MODEL: ${BENCHMARK_CHAT_MODEL}
      MEMRADER_API_KEY: ${BENCHMARK_CHAT_API_KEY}
      MEMRADER_API_BASE: ${BENCHMARK_CHAT_API_BASE}
      MEMREADER_GENERAL_MODEL: ${BENCHMARK_CHAT_MODEL}
      PREFERENCE_EXTRACTOR_MODEL: ${BENCHMARK_CHAT_MODEL}
      FEEDBACK_MODEL: ${BENCHMARK_CHAT_MODEL}
      SUGGESTION_MODEL: ${BENCHMARK_CHAT_MODEL}
      MEMSCHEDULER_MODEL: ${BENCHMARK_CHAT_MODEL}
      MOS_EMBEDDER_MODEL: ${BENCHMARK_EMBEDDING_MODEL}
      MOS_EMBEDDER_BACKEND: universal_api
      MOS_EMBEDDER_TIMEOUT: "90"
      MOS_EMBEDDER_API_BASE: ${BENCHMARK_EMBEDDING_API_BASE}
      MOS_EMBEDDER_API_KEY: ${BENCHMARK_EMBEDDING_API_KEY}
      EMBEDDING_DIMENSION: ${BENCHMARK_EMBEDDING_DIMENSIONS}
      MOS_RERANKER_BACKEND: cosine_local
      NEO4J_BACKEND: neo4j-community
      NEO4J_URI: bolt://memos-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${BENCHMARK_POSTGRES_PASSWORD}
      NEO4J_DB_NAME: neo4j
      MOS_NEO4J_SHARED_DB: "false"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MEMSCHEDULER_USE_REDIS_QUEUE: "false"

  memos-unit:
    <<: *unit
    image: ${BENCHMARK_MEMOS_IMAGE:-elf-benchmark-http:v3}
    depends_on:
      memos:
        condition: service_started
    command: ["python3", "/opt/benchmark/benchmark-unit.py", "--target", "memos"]

  sag-engine-unit:
    <<: *unit
    image: ${BENCHMARK_SAG_ENGINE_IMAGE:-elf-benchmark-sag-engine:v1}
    command: ["python3", "/opt/benchmark/benchmark-unit.py", "--target", "sag-engine"]

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: elf_benchmark
      POSTGRES_PASSWORD: ${BENCHMARK_POSTGRES_PASSWORD}
      POSTGRES_USER: elf_benchmark
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U elf_benchmark -d elf_benchmark
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - postgres-data:/var/lib/postgresql

  qdrant:
    image: qdrant/qdrant:v1.18.0
    volumes:
      - qdrant-data:/qdrant/storage

  lightrag:
    image: ghcr.io/hkuds/lightrag@sha256:04716d2f10557342e033395c6490903ed0849a41ac5f89008736a7383e8bad7a
    environment:
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      HOST: 0.0.0.0
      PORT: 9621
      LLM_BINDING: openai
      LLM_BINDING_HOST: ${BENCHMARK_CHAT_API_BASE}
      LLM_BINDING_API_KEY: ${BENCHMARK_CHAT_API_KEY}
      LLM_MODEL: ${BENCHMARK_CHAT_MODEL}
      OPENAI_LLM_REASONING_EFFORT: ${BENCHMARK_CHAT_REASONING_EFFORT}
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: ${BENCHMARK_EMBEDDING_API_BASE}
      EMBEDDING_BINDING_API_KEY: ${BENCHMARK_EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${BENCHMARK_EMBEDDING_MODEL}
      EMBEDDING_DIM: ${BENCHMARK_EMBEDDING_DIMENSIONS}
      EMBEDDING_SEND_DIM: "true"
      RERANK_BY_DEFAULT: "False"
      MAX_ASYNC_LLM: 1
      MAX_ASYNC_RERANK: 1
      MAX_PARALLEL_INSERT: 1
      CHUNK_SIZE: 320
      CHUNK_OVERLAP_SIZE: 32
    volumes:
      - lightrag-data:/app/data/rag_storage
      - lightrag-inputs:/app/data/inputs

  falkordb:
    image: falkordb/falkordb@sha256:286d829e23ea4f927d8c06859efb12a3288d00b03746a517f4d8c22b75202015
    volumes:
      - falkordb-data:/data

  honcho-database:
    image: pgvector/pgvector:pg15
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${BENCHMARK_POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - honcho-postgres-data:/var/lib/postgresql/data
      - ./honcho-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  honcho-redis:
    image: redis:8.2
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - honcho-redis-data:/data

  honcho-api:
    image: ${BENCHMARK_HONCHO_IMAGE:-elf-benchmark-honcho:v4}
    entrypoint: ["sh", "/app/docker/entrypoint.sh"]
    depends_on:
      honcho-database:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    environment: *honcho-environment
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()
      interval: 3s
      timeout: 5s
      retries: 60

  honcho-deriver:
    image: ${BENCHMARK_HONCHO_IMAGE:-elf-benchmark-honcho:v4}
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on:
      honcho-api:
        condition: service_started
    environment: *honcho-environment

  elf-unit:
    <<: *unit
    image: ${BENCHMARK_ELF_IMAGE:-elf-benchmark-elf:v5}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      <<: *unit-environment
      ELF_PG_DSN: postgres://elf_benchmark:${BENCHMARK_POSTGRES_PASSWORD}@postgres:5432/elf_benchmark
      ELF_QDRANT_GRPC_URL: http://qdrant:6334
    volumes: *unit-volumes
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - elf

  hindsight:
    image: ghcr.io/vectorize-io/hindsight@sha256:07873ca79a79bcb5662c6015bf9e40cf32fc0ae5bd7f5e8e71974fffa48e31c1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_API_KEY: ${BENCHMARK_CHAT_API_KEY}
      HINDSIGHT_API_LLM_BASE_URL: ${BENCHMARK_CHAT_API_BASE}
      HINDSIGHT_API_LLM_MODEL: ${BENCHMARK_CHAT_MODEL}
      HINDSIGHT_API_LLM_REASONING_EFFORT: ${BENCHMARK_CHAT_REASONING_EFFORT}
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "1"
      HINDSIGHT_API_LLM_MAX_RETRIES: "0"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${BENCHMARK_EMBEDDING_API_KEY}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: ${BENCHMARK_EMBEDDING_API_BASE}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: ${BENCHMARK_EMBEDDING_MODEL}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS: ${BENCHMARK_EMBEDDING_DIMENSIONS}
      HINDSIGHT_API_EMBEDDINGS_MAX_CONCURRENT_REQUESTS: "1"
      HINDSIGHT_API_RERANKER_LOCAL_FORCE_CPU: "true"

  hindsight-unit:
    <<: *unit
    image: ${BENCHMARK_HINDSIGHT_IMAGE:-elf-benchmark-http:v1}
    depends_on:
      hindsight:
        condition: service_started
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - hindsight

  gbrain-unit:
    <<: *unit
    image: ${BENCHMARK_GBRAIN_IMAGE:-elf-benchmark-gbrain:v1}
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - gbrain

  mem0-unit:
    <<: *unit
    image: ${BENCHMARK_MEM0_IMAGE:-elf-benchmark-mem0:v2}
    environment:
      <<: *unit-environment
      MEM0_INFER: ${BENCHMARK_MEM0_INFER:-true}
    depends_on:
      qdrant:
        condition: service_started
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - mem0

  qmd-unit:
    <<: *unit
    image: ${BENCHMARK_QMD_IMAGE:-elf-benchmark-qmd:v6}
    environment:
      <<: *unit-environment
      QMD_BENCHMARK_MODE: ${BENCHMARK_QMD_MODE:-hybrid_rerank}
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - qmd

  lightrag-unit:
    <<: *unit
    image: ${BENCHMARK_LIGHTRAG_IMAGE:-elf-benchmark-http:v4}
    depends_on:
      lightrag:
        condition: service_started
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - lightrag

  pageindex-unit:
    <<: *unit
    image: ${BENCHMARK_PAGEINDEX_IMAGE:-elf-benchmark-pageindex:v4}
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - pageindex

  openviking-unit:
    <<: *unit
    image: ${BENCHMARK_OPENVIKING_IMAGE:-elf-benchmark-openviking:v4}
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - openviking

  graphiti-unit:
    <<: *unit
    image: ${BENCHMARK_GRAPHITI_IMAGE:-elf-benchmark-graphiti:v4}
    depends_on:
      falkordb:
        condition: service_started
    environment:
      <<: *unit-environment
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_DATABASE: elf_benchmark
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - graphiti

  graphrag-unit:
    <<: *unit
    image: ${BENCHMARK_GRAPHRAG_IMAGE:-elf-benchmark-graphrag:v4}
    command:
      - /opt/graphrag-venv/bin/python
      - /opt/benchmark/benchmark-unit.py
      - --target
      - graphrag

  openkb-unit:
    <<: *unit
    image: ${BENCHMARK_OPENKB_IMAGE:-elf-benchmark-openkb:v4}
    environment:
      <<: *unit-environment
      OPENKB_TIMEOUT_SECONDS: "1200"
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - openkb

  honcho-unit:
    <<: *unit
    image: ${BENCHMARK_HONCHO_IMAGE:-elf-benchmark-honcho:v4}
    tmpfs:
      - /benchmark/state:mode=1777
    depends_on:
      honcho-api:
        condition: service_started
      honcho-deriver:
        condition: service_started
    environment:
      <<: *unit-environment
      HONCHO_URL: http://honcho-api:8000
      HONCHO_REPO_DIR: /app
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - honcho

volumes:
  postgres-data:
  qdrant-data:
  lightrag-data:
  lightrag-inputs:
  falkordb-data:
  honcho-postgres-data:
  honcho-redis-data:
