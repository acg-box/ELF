# Rust workspace tasks: Clean.

[tasks.clean-baseline-live-docker]
args = [
	"compose",
	"-f",
	"docker-compose.baseline.yml",
	"down",
	"-v",
	"--remove-orphans",
]
command = "docker"

[tasks.clean-parity-docker]
args = [
	"compose",
	"-f",
	"docker-compose.parity.yml",
	"down",
	"-v",
	"--remove-orphans",
]
command = "docker"

# Git SHA is embedded by the shared CLI metadata crate and application build scripts.
[tasks.clean-release]
args = [
	"clean",
	"--release",
	"--locked",
	"-p",
	"elf-cli",
	"-p",
	"elf-api",
	"-p",
	"elf-worker",
	"-p",
	"elf-mcp",
	"-p",
	"elf-eval",
	"${@}",
]
command = "cargo"
